<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Suren Pastries — Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-icon">🔐</div>
    <div class="login-title">Admin Portal</div>
    <div class="login-sub">Sign in to manage your restaurant</div>

    <div id="login-error" style="display:none;background:#FDECEA;color:#B3261E;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;text-align:left"></div>

    <form id="login-form">
      <input class="login-input" type="text" id="username" placeholder="Username" autofocus required/>
      <input class="login-input" type="password" id="password" placeholder="Password" required/>
      <button class="login-btn" type="submit">Sign in</button>
    </form>
    <div class="login-hint">Forgot your credentials? Ask whoever set up the server, or re-run <code>python scripts/seed.py</code> on the backend.</div>
  </div>
</div>

<script src="../js/config.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errBox = document.getElementById('login-error');
    errBox.style.display = 'none';
    try {
      const res = await fetch(window.API_BASE + '/api/auth/login', {
        method: 'POST',
        credentials: 'include',                 // needed so the session cookie is set cross-site
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        errBox.textContent = data.error || 'Invalid username or password.';
        errBox.style.display = 'block';
        return;
      }
      window.location.href = 'dashboard.html';
    } catch (err) {
      errBox.textContent = 'Could not reach the server. Check API_BASE in js/config.js.';
      errBox.style.display = 'block';
    }
  });

  // If already logged in, skip straight to the dashboard.
  (async () => {
    try {
      const res = await fetch(window.API_BASE + '/api/auth/me', { credentials: 'include' });
      const data = await res.json();
      if (data.authenticated) window.location.href = 'dashboard.html';
    } catch (err) { /* stay on login */ }
  })();
</script>
</body>
</html>
