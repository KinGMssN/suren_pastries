<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Suren Pastries — Loading</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/loader.css">
<style>html,body{height:100%;overflow:hidden}</style>
</head>
<body>
<div class="bg">
  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
</div>

<div class="loader">
  <div class="plate-ring">
    <div class="ring-outer"></div>
    <div class="ring-inner"></div>
    <div class="plate-center">🍽️</div>
  </div>
  <div class="logo-wrap"><div class="logo">SUREN PASTRIES</div></div>
  <div class="tagline">Fine dining experience</div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill"></div></div>
    <div class="progress-label">Preparing your experience</div>
    <div class="progress-pct" id="pct">0%</div>
  </div>
  <div class="dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
</div>

<script>
  let p = 0;
  const pct = document.getElementById('pct');
  const iv = setInterval(() => {
    p = Math.min(p + Math.random() * 4, 100);
    pct.textContent = Math.floor(p) + '%';
    if (p >= 100) {
      clearInterval(iv);
      pct.textContent = '100%';
      setTimeout(() => {
        document.body.classList.add('done');
        setTimeout(() => location.href = 'landing.html', 500);
      }, 400);
    }
  }, 60);
</script>
</body>
</html>
