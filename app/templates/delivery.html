{% extends "base.html" %}
{% block title %}Suren Pastries — Delivery{% endblock %}
{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/delivery.css') }}">
{% endblock %}
{% block body %}

<nav class="site-nav">
  <a href="{{ url_for('main.home') }}" class="logo" style="text-decoration:none;">SUREN PASTRIES</a>
  <div class="nav-links">
    <a class="nl" href="{{ url_for('main.home') }}">Home</a>
  </div>
</nav>

<div class="dl-page">
  <div class="dl-header">
    <div class="dl-title">🚚 Delivery</div>
    <div class="dl-sub">Sign in with the credentials provided by your administrator.</div>
  </div>

  <form class="dl-picker" id="delivery-login-form">
    <label for="delivery-name">Name</label>
    <input class="dl-input" id="delivery-name" name="name" autocomplete="username" required/>
    <label for="delivery-password">Password</label>
    <input class="dl-input" id="delivery-password" name="password" type="password" autocomplete="current-password" required/>
    <p class="dl-error" id="delivery-error" role="alert" hidden></p>
    <button class="dl-btn dl-btn-assign" type="submit">Sign in</button>
  </form>

  <section id="delivery-work" hidden>
    <button class="dl-btn dl-btn-logout" type="button" data-action="delivery-logout">Sign out</button>
    <div id="delivery-orders"></div>
  </section>
</div>
{% endblock %}
{% block page_js %}
<script src="{{ url_for('static', filename='js/delivery.js') }}"></script>
{% endblock %}
