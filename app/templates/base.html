<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>{% block title %}Suren Pastries{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
{% block page_css %}{% endblock %}
</head>
<body{% block body_attrs %}{% endblock %}>
{% block body %}{% endblock %}

<div class="cookie-notice" id="cookie-notice" role="region" aria-label="Cookie notice" hidden>
	<p>We use only essential storage to keep your cart and account working. We do not use advertising or analytics cookies.</p>
	<button type="button" class="cookie-dismiss" data-action="dismiss-cookies">OK</button>
	<a href="{{ url_for('main.cookies') }}">Cookie policy</a>
</div>

<script src="{{ url_for('static', filename='js/transitions.js') }}"></script>
<script src="{{ url_for('static', filename='js/cookies.js') }}"></script>
{% block page_js %}{% endblock %}
</body>
</html>
