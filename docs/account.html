<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Suren Pastries — My Account</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/account.css">
</head>
<body>

<nav class="site-nav">
  <a href="landing.html" class="logo" style="text-decoration:none;">SUREN PASTRIES</a>
  <div class="nav-links">
    <a class="nl" href="landing.html">Home</a>
    <a class="nl" href="menu.html">Menu</a>
    <a class="nl" href="about.html">About</a>
  </div>
  <button class="nl" onclick="customerLogout()" style="cursor:pointer">Logout</button>
</nav>

<div class="acct-page">
  <div class="acct-header">
    <div class="acct-avatar">👤</div>
    <div>
      <div class="acct-header-name" id="acct-name">…</div>
      <div class="acct-header-phone" id="acct-phone">…</div>
    </div>
  </div>

  <div class="acct-grid">
    <div class="acct-card">
      <h2 class="acct-section-title">Saved addresses</h2>
      <div id="address-list"></div>

      <form onsubmit="addAddress(event)" class="acct-address-form">
        <label class="acct-label">Label</label>
        <input class="acct-input" type="text" id="addr-label" placeholder="Home, Work, etc." value="Home"/>
        <label class="acct-label">Address</label>
        <input class="acct-input" type="text" id="addr-line" placeholder="House no, street, area" required/>
        <div class="acct-input-row">
          <div>
            <label class="acct-label">City</label>
            <input class="acct-input" type="text" id="addr-city" placeholder="City"/>
          </div>
          <div>
            <label class="acct-label">Pincode</label>
            <input class="acct-input" type="text" id="addr-pincode" placeholder="Pincode"/>
          </div>
        </div>
        <label style="display:flex;align-items:center;gap:8px;margin:10px 0;font-size:13px;color:var(--muted)">
          <input type="checkbox" id="addr-default" style="width:auto"/> Set as default address
        </label>
        <button class="acct-btn-primary" type="submit">+ Add address</button>
      </form>
    </div>

    <div class="acct-card">
      <h2 class="acct-section-title">Past orders</h2>
      <div id="order-history-list"></div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/customer.js"></script>
<script src="js/transitions.js"></script>
<script>loadAccountPage();</script>
</body>
</html>
